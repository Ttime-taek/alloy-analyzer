name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-fastapi.txt
      - name: Install dependencies
        run: pip install -r requirements-fastapi.txt
      - name: Regression check
        run: python regression_check.py
      - name: Syntax check
        run: python -m py_compile api_server.py analyzer.py models.py env_loader.py
      - name: Import API module
        run: python -c "import api_server; print('ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run lint
