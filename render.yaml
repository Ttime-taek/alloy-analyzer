services:
  - type: web
    name: alloy-analyzer-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/about
    envVars:
      - key: ALLOY_SERVE_STATIC
        value: "0"
      - key: ALLOY_API_CORS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
